# Compile Trombone sur un Windows de GitHub : installateur + version portable.
# Lancé à la main ; cocher « publier » crée en plus la version publique (Release) correspondante.
# La signature viendra se brancher après l'étape « Compiler ».
name: Windows
on:
  workflow_dispatch:
    inputs:
      publier:
        description: Publier une version publique (Release) avec les exécutables
        type: boolean
        default: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Compiler
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: trombone-windows
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publier la version
        if: ${{ inputs.publier }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" "dist/Trombone-Installation-$version.exe" "dist/Trombone-Portable-$version.exe" \
            --target "$GITHUB_SHA" --title "Trombone $version" --notes-file .github/notes-version.md
